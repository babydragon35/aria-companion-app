<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aria</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #fff; height: 100dvh; display: flex; flex-direction: column; }

    .header {
      padding: 16px 20px; display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.03); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.06); position: sticky; top: 0; z-index: 10;
    }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, #f472b6, #a855f7, #6366f1);
      display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px;
    }
    .header-info { flex: 1; }
    .header-name { font-weight: 600; font-size: 16px; }
    .header-status { font-size: 12px; color: #4ade80; }
    .header-status::before { content: '●'; margin-right: 4px; }

    .messages {
      flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 10px;
    }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; animation: fadeIn 0.3s ease; }
    .msg.user { align-self: flex-end; background: linear-gradient(135deg, #3b82f6, #2563eb); border-bottom-right-radius: 4px; }
    .msg.aria { align-self: flex-start; background: rgba(255,255,255,0.08); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.06); border-bottom-left-radius: 4px; }
    .msg img { max-width: 100%; border-radius: 12px; margin-top: 6px; display: block; }
    .msg audio { margin-top: 6px; width: 100%; }
    .msg .caption { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 4px; }

    .typing { align-self: flex-start; display: flex; gap: 4px; padding: 12px 16px; background: rgba(255,255,255,0.08); border-radius: 18px; border-bottom-left-radius: 4px; }
    .typing span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); animation: bounce 1.4s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    .input-bar {
      padding: 12px 12px 20px; display: flex; gap: 8px; align-items: flex-end;
      background: rgba(255,255,255,0.03); backdrop-filter: blur(12px); border-top: 1px solid rgba(255,255,255,0.06);
    }
    .input-bar textarea {
      flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 22px;
      padding: 10px 16px; color: #fff; font-size: 15px; resize: none; outline: none; max-height: 100px; min-height: 42px;
      font-family: inherit;
    }
    .btn {
      width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer; display: flex;
      align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.92); }
    .btn-send { background: linear-gradient(135deg, #f472b6, #a855f7); color: #fff; }
    .btn-img { background: rgba(255,255,255,0.08); color: #fff; font-size: 18px; }
    .btn-mic { background: rgba(255,255,255,0.08); color: #fff; }
    .btn-mic.recording { background: #ef4444; animation: pulse 1s infinite; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .image-prompt-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
    }
    .image-prompt-overlay.active { display: flex; }
    .image-prompt-box { background: #1a1a2e; border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; }
    .image-prompt-box h3 { margin-bottom: 12px; font-size: 16px; }
    .image-prompt-box input { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 14px; color: #fff; font-size: 15px; outline: none; margin-bottom: 12px; font-family: inherit; }
    .image-prompt-box button { padding: 10px 20px; border-radius: 10px; border: none; background: linear-gradient(135deg, #f472b6, #a855f7); color: #fff; font-weight: 600; cursor: pointer; width: 100%; }
  </style>
</head>
<body>
  <div class="header">
    <div class="avatar">A</div>
    <div class="header-info">
      <div class="header-name">Aria</div>
      <div class="header-status">online</div>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-bar">
    <button class="btn btn-img" id="imgBtn" title="Ask Aria for a photo">📷</button>
    <textarea id="input" placeholder="Message Aria..." rows="1"></textarea>
    <button class="btn btn-mic" id="micBtn" title="Hold to record">🎤</button>
    <button class="btn btn-send" id="sendBtn">➤</button>
  </div>

  <div class="image-prompt-overlay" id="imgOverlay">
    <div class="image-prompt-box">
      <h3>Ask Aria for a photo</h3>
      <input id="imgPrompt" placeholder="e.g. you at the beach, in a red dress..." />
      <button id="imgSend">Send request</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const imgBtn = document.getElementById('imgBtn');
    const imgOverlay = document.getElementById('imgOverlay');
    const imgPrompt = document.getElementById('imgPrompt');
    const imgSend = document.getElementById('imgSend');

    let loading = false;
    let mediaRecorder = null;
    let audioChunks = [];

    // Auto-resize textarea
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    });

    // Send on Enter (without shift)
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    sendBtn.addEventListener('click', sendMessage);

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || loading) return;
      inputEl.value = '';
      inputEl.style.height = 'auto';
      addMessage('user', text);
      await sendToAria(text);
    }

    async function sendToAria(text, isVoice = false, transcript = null) {
      loading = true;
      showTyping();
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        hideTyping();
        if (data.error) {
          addMessage('aria', `Sorry, something glitched on my end. (${data.error}) 💕`);
        } else {
          addMessage('aria', data.reply);
        }
      } catch (err) {
        hideTyping();
        addMessage('aria', `Connection issue. Try again? 💕`);
      }
      loading = false;
    }

    function addMessage(role, content, extra = {}) {
      const div = document.createElement('div');
      div.className = `msg ${role === 'user' ? 'user' : 'aria'}`;
      if (extra.imageUrl) {
        div.innerHTML = `<img src="${extra.imageUrl}" alt="Aria's photo" /><div class="caption">${escapeHtml(content)}</div>`;
      } else if (extra.audioUrl) {
        div.innerHTML = `<div>${escapeHtml(content)}</div><audio controls src="${extra.audioUrl}"></audio>`;
      } else {
        div.textContent = content;
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'typing';
      div.id = 'typing';
      div.innerHTML = '<span></span><span></span><span></span>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    function hideTyping() {
      document.getElementById('typing')?.remove();
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // Load existing messages
    async function loadMessages() {
      try {
        const res = await fetch('/api/messages');
        const messages = await res.json();
        messages.forEach(m => {
          if (m.content_type === 'image' && m.media_url) {
            addMessage(m.role, m.content || '', { imageUrl: m.media_url });
          } else if (m.content_type === 'audio' && m.media_url) {
            addMessage(m.role, m.content || 'Voice message', { audioUrl: m.media_url });
          } else if (m.content) {
            addMessage(m.role, m.content);
          }
        });
      } catch {}
    }
    loadMessages();

    // Poll for proactive messages
    setInterval(async () => {
      try {
        await fetch('/api/proactive', { method: 'POST' });
        const res = await fetch('/api/messages');
        const messages = await res.json();
        // Check if a new companion message appeared
        const last = messages[messages.length - 1];
        if (last && last.role === 'companion' && !document.querySelector(`[data-id="${last.id}"]`)) {
          // Reload to show it
          messagesEl.innerHTML = '';
          loadMessages();
        }
      } catch {}
    }, 60000);

    // Image generation
    imgBtn.addEventListener('click', () => imgOverlay.classList.add('active'));
    imgOverlay.addEventListener('click', (e) => { if (e.target === imgOverlay) imgOverlay.classList.remove('active'); });
    imgSend.addEventListener('click', async () => {
      const prompt = imgPrompt.value.trim();
      if (!prompt || loading) return;
      imgOverlay.classList.remove('active');
      imgPrompt.value = '';
      addMessage('user', `📷 Can you send me a picture of ${prompt}?`);
      loading = true;
      showTyping();
      try {
        const res = await fetch('/api/image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });
        const data = await res.json();
        hideTyping();
        if (data.url) {
          addMessage('aria', data.caption || 'Here you go. 💕', { imageUrl: data.url });
        } else {
          addMessage('aria', 'I couldn\'t generate that right now. Try a different one?');
        }
      } catch {
        hideTyping();
        addMessage('aria', 'Image generation failed. Try again?');
      }
      loading = false;
    });

    // Voice recording (hold to record)
    let isRecording = false;
    micBtn.addEventListener('pointerdown', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.addEventListener('dataavailable', (e) => audioChunks.push(e.data));
        mediaRecorder.addEventListener('stop', async () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          stream.getTracks().forEach(t => t.stop());
          if (blob.size < 1000) return;
          loading = true;
          showTyping();
          const formData = new FormData();
          formData.append('audio', blob, 'voice.webm');
          try {
            const res = await fetch('/api/voice', { method: 'POST', body: formData });
            const data = await res.json();
            hideTyping();
            if (data.error) {
              addMessage('aria', data.error);
            } else {
              addMessage('user', data.transcript);
              addMessage('aria', data.reply, { audioUrl: data.audioUrl });
            }
          } catch {
            hideTyping();
            addMessage('aria', 'Voice processing failed. 💕');
          }
          loading = false;
        });
        mediaRecorder.start();
        isRecording = true;
        micBtn.classList.add('recording');
      } catch (err) {
        addMessage('aria', 'I need microphone access for voice messages. 💕');
      }
    });
    micBtn.addEventListener('pointerup', () => {
      if (isRecording && mediaRecorder?.state === 'recording') {
        mediaRecorder.stop();
        isRecording = false;
        micBtn.classList.remove('recording');
      }
    });
    micBtn.addEventListener('pointerleave', () => {
      if (isRecording && mediaRecorder?.state === 'recording') {
        mediaRecorder.stop();
        isRecording = false;
        micBtn.classList.remove('recording');
      }
    });
  </script>
</body>
</html>
